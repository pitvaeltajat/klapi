name: Generate PDF manual

on:
  push:
    paths:
      - 'KLAPI_Kayttoohjeet_lainaajalle.md'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install

      - name: Install md-to-pdf
        run: pnpm add -D md-to-pdf

      - name: Generate PDF from Markdown
        run: node scripts/generate-pdf.js

      - name: Commit and push PDF
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/KLAPI_Kayttoohjeet_lainaajalle.pdf
          git commit -m 'ci: generate PDF manual [skip ci]' || echo "No changes to commit"
          git push
